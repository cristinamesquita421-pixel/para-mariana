<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mariana ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    background: linear-gradient(135deg, #1a0a2e 0%, #2d1b3d 100%);
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    color: #fff;
    min-height: 100vh;
    animation: fadeIn 0.8s ease-in;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    font-size: 24px;
    margin-bottom: 10px;
}

p {
    color: #ccc;
    margin-bottom: 20px;
    font-size: 16px;
}

.botoes-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin: 20px 0;
}

button {
    padding: 15px 20px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: rgba(255, 105, 180, 0.8);
    color: white;
    font-weight: bold;
    transition: all 0.3s ease;
    width: 100%;
    max-width: 300px;
}

button:hover:not(:disabled) {
    background: rgba(255, 20, 147, 1);
    transform: scale(1.05);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#mensagem {
    margin-top: 30px;
    font-size: 18px;
    line-height: 1.6;
    animation: fadeMessage 0.5s ease-in;
    min-height: 50px;
}

@keyframes fadeMessage {
    from { opacity: 0; }
    to { opacity: 1; }
}

#euteamo {
    font-size: 20px;
    color: #ff1493;
    margin-top: 40px;
    font-weight: bold;
    animation: piscar 1s infinite;
}

@keyframes piscar {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
}

#coracaoSecreto {
    position: fixed;
    font-size: 40px;
    cursor: pointer;
    opacity: 0.3;
    right: 20px;
    bottom: 100px;
    transition: all 0.3s ease;
    animation: flutuar 5s ease-in-out infinite;
}

#coracaoSecreto:hover {
    opacity: 1;
    transform: scale(1.3);
}

@keyframes flutuar {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
}

.coracao {
    position: fixed;
    font-size: 30px;
    pointer-events: none;
    animation: cair 3s linear forwards;
}

@keyframes cair {
    to {
        transform: translateY(100vh);
        opacity: 0;
    }
}

.container-buque {
    width: 200px;
    height: 200px;
    margin: 30px auto;
    perspective: 1000px;
    animation: girar 8s infinite linear;
}

@keyframes girar {
    from { transform: rotateY(0deg); }
    to { transform: rotateY(360deg); }
}

.tulipa3d {
    position: absolute;
    font-size: 40px;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#modalBg {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 100;
}

#modal {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #2d1b3d 0%, #1a0a2e 100%);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    z-index: 101;
    color: white;
    width: 90%;
    max-width: 400px;
    animation: popIn 0.3s ease-out;
}

#modalBgMusicas {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 100;
}

/* Carrossel de Fotos */
#modalBgCarrossel {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    z-index: 100;
}

#modalCarrossel {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #2d1b3d 0%, #1a0a2e 100%);
    padding: 20px;
    border-radius: 20px;
    text-align: center;
    z-index: 101;
    color: white;
    width: 90%;
    max-width: 500px;
    animation: popIn 0.3s ease-out;
}

.carrossel-container {
    position: relative;
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
}

.carrossel-img {
    width: 100%;
    height: 400px;
    border-radius: 15px;
    object-fit: cover;
    margin-bottom: 15px;
}

.carrossel-desc {
    font-size: 16px;
    margin-bottom: 20px;
    color: #fff;
    font-style: italic;
}

.carrossel-controles {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.carrossel-btn {
    background: rgba(255, 105, 180, 0.8);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s ease;
    flex: 1;
}

.carrossel-btn:hover {
    background: rgba(255, 20, 147, 1);
}

.carrossel-contador {
    font-size: 14px;
    color: #ccc;
    margin-top: 10px;
}

#modalMusicas {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #2d1b3d 0%, #1a0a2e 100%);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    z-index: 101;
    color: white;
    width: 90%;
    max-width: 500px;
    animation: popIn 0.3s ease-out;
    max-height: 80vh;
    overflow-y: auto;
}

@keyframes popIn {
    from { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

.flor {
    position: fixed;
    font-size: 20px;
    opacity: 0.3;
    pointer-events: none;
    animation: flutuar 4s ease-in-out infinite;
    z-index: -1;
}

.musicas-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
    margin-top: 20px;
    max-height: 400px;
    overflow-y: auto;
}

@media (min-width: 768px) {
    .musicas-grid {
        grid-template-columns: repeat(2, 1fr);
        max-height: 500px;
    }
}

.musica-card {
    background: rgba(255, 255, 255, 0.1);
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    color: white;
    display: block;
    border: 2px solid rgba(255, 105, 180, 0.5);
}

.musica-card:hover {
    background: rgba(255, 105, 180, 0.3);
    transform: scale(1.05);
    border-color: rgba(255, 105, 180, 1);
}

.musica-icone {
    font-size: 60px;
    margin-bottom: 10px;
}

.musica-nome {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 5px;
}

.musica-artista {
    font-size: 12px;
    color: #ccc;
}

</style>

function triste(){

function criarCoracoes(){
    for(let i = 0; i < 15; i++){

            coracao.className = "coracao";

            document.body.appendChild(coracao);

}

function buque(){
    let buqueHTML = "Um buquê de tulipas pra você ❤️<br><br>Cada uma representa um dia que você me faz feliz ❤️<div class='container-buque'>";
    
    for(let i = 0; i < 20; i++){
        const angulo = (i / 20) * Math.PI * 2;
        const raio = 80;
        const x = Math.cos(angulo) * raio;
        const y = Math.sin(angulo) * raio;
        const z = Math.random() * 60;
        
        buqueHTML += `<div class='tulipa3d' style='transform: translateX(${x}px) translateY(${y}px) translateZ(${z}px); left: 75px; top: 50px;'>🌷</div>`;
    }
    
    buqueHTML += "</div>";
    document.getElementById("mensagem").innerHTML = buqueHTML;
}

function tocarSom(){
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.frequency.value = 200;
        oscillator.type = 'sine';
        
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.1);
    } catch(e) {}
}

document.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', tocarSom);
});

function fecharModal(){

document.getElementById("coracaoSecreto").addEventListener("click", function(){

function abrirModalMusicas(){
    document.getElementById("modalBgMusicas").style.display = "block";
    document.getElementById("modalMusicas").style.display = "block";
    
    let grid = document.getElementById("musicasGrid");
    grid.innerHTML = "";
    
    musicas.forEach(musica => {
        const card = document.createElement("a");

        card.target = "_blank";
        card.className = "musica-card";
        card.innerHTML = `
            <div class="musica-icone">${musica.icone}</div>
            <div class="musica-nome">${musica.nome}</div>
            <div class="musica-artista">${musica.artista}</div>

function atualizarFoto() {
